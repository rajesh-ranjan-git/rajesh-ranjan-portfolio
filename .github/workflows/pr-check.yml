name: PR Check

# Lints and builds every pull request into main, so a broken change is caught
# before it merges and deploys. Uses no secrets: the build runs without the
# production env file. See "Branching" in README.md.

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

# A new push to the same PR cancels the check still running for the old one.
concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  source-branch:
    # Rulesets can't limit which branch a pull request comes from, so this job
    # fails any pull request into main that isn't from alpha in this repository.
    # Like "Lint and build", the ruleset requires it by this name.
    name: Source branch is alpha
    runs-on: ubuntu-latest

    steps:
      - name: Check the pull request comes from alpha
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          if [ "$HEAD_REF" != "alpha" ] || [ "$HEAD_REPO" != "$BASE_REPO" ]; then
            echo "::error::Pull requests into main must come from the alpha branch of $BASE_REPO. This one comes from $HEAD_REPO:$HEAD_REF."
            exit 1
          fi
          echo "Source branch is $HEAD_REPO:$HEAD_REF."

  check:
    # This name is what the ruleset's "Require status checks" rule matches.
    # Rename it there too if it ever changes here.
    name: Lint and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
