name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: production
      url: https://rajeshranjan.dev

    env:
      LOG_FILE: ${{ github.workspace }}/deploy-logs.txt

    steps:
      - name: Checkout latest Portfolio code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Detect Portfolio changed services
        id: changes
        run: |
          set -euo pipefail

          : > "$LOG_FILE"
          exec > >(tee -a "$LOG_FILE") 2>&1

          echo "===== STARTING PORTFOLIO DEPLOYMENT ====="

          echo "START_TIME=$(date +%s)" >> "$GITHUB_ENV"

          echo ""
          echo "NODE VERSION:"
          node -v

          echo ""
          echo "NPM VERSION:"
          npm -v

          echo ""
          echo "Checking changed files for Portfolio..."
          if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            CHANGED_FILES=$(git ls-files)
          else
            CHANGED_FILES=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")
          fi
          echo "$CHANGED_FILES"

          BUILD_NEEDED=false

          if echo "$CHANGED_FILES" | grep -qvE '(^README\.md$|^CHANGELOG\.md$|^RELEASE\.md$|^LICENSE$|^LICENSE\.md$|^\.gitignore$|^docs/)'; then
            BUILD_NEEDED=true
          fi

          if [ -n "$CHANGED_FILES" ] && [ "$BUILD_NEEDED" = "true" ]; then
            echo "portfolio=true" >> "$GITHUB_OUTPUT"
          else
            echo "portfolio=false" >> "$GITHUB_OUTPUT"
          fi

          if echo "$CHANGED_FILES" | grep -qE '^(package(-lock)?\.json)$' > /dev/null; then
            echo "portfolio_install=true" >> "$GITHUB_OUTPUT"
          else
            echo "portfolio_install=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy Portfolio changed services via SSH
        if: steps.changes.outputs.portfolio == 'true'
        id: deploy
        run: |
          set -euo pipefail

          exec > >(tee -a "$LOG_FILE") 2>&1

          mkdir -p ~/.ssh
          echo "${{ secrets.PORTFOLIO_EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            "${{ secrets.USERNAME }}@${{ secrets.HOST }}" bash -s <<'REMOTE_SCRIPT'
            set -euo pipefail

            cd ~/portfolio/rajesh-ranjan-portfolio

            echo "Pulling latest Portfolio code..."
            git fetch --prune origin
            git reset --hard origin/main
            git clean -fd

            echo "Cleaning previous build artifacts..."
            rm -rf .next
            rm -rf out
            rm -rf .turbo

            if [ "${{ steps.changes.outputs.portfolio_install }}" = "true" ]; then
              echo "Installing latest dependencies for Portfolio..."
              rm -rf node_modules
              npm ci
            else
              echo "No dependency changes for Portfolio. Skipping dependencies installation!"
            fi

            echo "Building latest Portfolio code..."
            npm run build

            echo "Reloading Portfolio application..."
            if pm2 describe portfolio >/dev/null 2>&1; then
                pm2 reload portfolio --update-env
            else
                pm2 start ecosystem.config.cjs --only portfolio
            fi

            sleep 5

            STATUS=$(pm2 jlist | jq -r '.[] | select(.name=="portfolio") | .pm2_env.status')

            if [ "$STATUS" != "online" ]; then
                echo "Reload failed. Attempting clean restart..."

                pm2 delete portfolio >/dev/null 2>&1 || true
                pm2 start ecosystem.config.cjs --only portfolio

                sleep 5

                STATUS=$(pm2 jlist | jq -r '.[] | select(.name=="portfolio") | .pm2_env.status')

                if [ "$STATUS" != "online" ]; then
                    echo "Portfolio failed to start after clean restart."
                    pm2 logs portfolio --lines 100
                    exit 1
                fi
            fi

            pm2 save
            echo "Portfolio is online."

            echo "===== PORTFOLIO SERVER STATS ====="
            echo ""
            echo "CPU LOAD:"
            uptime

            echo ""
            echo "MEMORY:"
            free -h

            echo ""
            echo "DISK:"
            df -h

            echo ""
            echo "PM2 STATUS:"
            pm2 status
          REMOTE_SCRIPT

          echo ""
          echo "DEPLOYMENT DURATION:"
          END_TIME=$(date +%s)
          echo "$((END_TIME - START_TIME)) seconds"

          echo "Latest Portfolio code deployed successfully!"
          echo "===== PORTFOLIO DEPLOYMENT FINISHED ====="

      - name: Send Portfolio Deployment Success Email
        if: success()

        uses: dawidd6/action-send-mail@v3

        with:
          server_address: ${{ secrets.AWS_SMTP_ENDPOINT }}
          server_port: ${{ secrets.AWS_SMTP_PORT }}

          username: ${{ secrets.AWS_SMTP_USERNAME }}
          password: ${{ secrets.AWS_SMTP_PASSWORD }}

          subject: "✅ Portfolio Deployment Successful!"

          to: ${{ secrets.AWS_EMAIL_TO }}
          from: "Rajesh Ranjan | Portfolio <${{ secrets.AWS_EMAIL_FROM }}>"

          convert_markdown: false

          html_body: |
            <div style="font-family:Arial;background:#f5f5f5;padding:30px">
              <div style="max-width:600px;margin:auto;background:white;border-radius:12px;overflow:hidden">
                <div style="height:4px;background:linear-gradient(90deg,#3f82d9,#8b5cf6,#f54568)"></div>

                <div style="padding:24px">
                  <h1 style="margin-top:0">🚀 Portfolio Deployment Completed</h1>

                  <table style="width:100%;border-collapse:collapse">
                    <tr>
                      <td style="padding:6px 16px 6px 0"><strong>Repository</strong></td>
                      <td style="padding:6px 0">${{ github.repository }}</td>
                    </tr>

                    <tr>
                      <td style="padding:6px 16px 6px 0"><strong>Environment</strong></td>
                      <td style="padding:6px 0">Production</td>
                    </tr>

                    <tr>
                      <td style="padding:6px 16px 6px 0"><strong>Branch</strong></td>
                      <td style="padding:6px 0">${{ github.ref_name }}</td>
                    </tr>

                    <tr>
                      <td style="padding:6px 16px 6px 0"><strong>Commit</strong></td>
                      <td style="padding:6px 0">${{ github.sha }}</td>
                    </tr>

                    <tr>
                      <td style="padding:6px 16px 6px 0"><strong>Commit Message</strong></td>
                      <td style="padding:6px 0">${{ github.event.head_commit.message }}</td>
                    </tr>

                    <tr>
                      <td style="padding:6px 16px 6px 0"><strong>Triggered By</strong></td>
                      <td style="padding:6px 0">${{ github.actor }}</td>
                    </tr>

                    <tr>
                      <td style="padding:6px 16px 6px 0"><strong>Build Executed</strong></td>
                      <td style="padding:6px 0">${{ steps.changes.outputs.portfolio }}</td>
                    </tr>

                    <tr>
                      <td style="padding:6px 16px 6px 0"><strong>Dependencies Installed</strong></td>
                      <td style="padding:6px 0">${{ steps.changes.outputs.portfolio_install }}</td>
                    </tr>
                  </table>

                  <div style="margin-top:20px">
                    <a
                      href="https://rajeshranjan.dev"
                      style="background:#059669;color:white;padding:12px 18px;text-decoration:none;border-radius:8px"
                    >
                      Go to Portfolio
                    </a>
                  </div>
                </div>
              </div>
            </div>

          attachments: deploy-logs.txt

      - name: Send Portfolio Deployment Failure Email
        if: failure()

        uses: dawidd6/action-send-mail@v3

        with:
          server_address: ${{ secrets.AWS_SMTP_ENDPOINT }}
          server_port: ${{ secrets.AWS_SMTP_PORT }}

          username: ${{ secrets.AWS_SMTP_USERNAME }}
          password: ${{ secrets.AWS_SMTP_PASSWORD }}

          subject: "❌ Portfolio Deployment Failed!"

          to: ${{ secrets.AWS_EMAIL_TO }}
          from: "Rajesh Ranjan | Portfolio <${{ secrets.AWS_EMAIL_FROM }}>"

          convert_markdown: false

          html_body: |
            <div style="font-family:Arial;background:#f5f5f5;padding:30px">
              <div style="max-width:600px;margin:auto;background:white;border-radius:12px;overflow:hidden">
                <div style="height:4px;background:linear-gradient(90deg,#3f82d9,#8b5cf6,#f54568)"></div>

                <div style="padding:24px">
                  <h1 style="margin-top:0">⛔ Portfolio Deployment Failed</h1>

                  <table style="width:100%;border-collapse:collapse">
                    <tr>
                      <td style="padding:6px 16px 6px 0"><strong>Repository</strong></td>
                      <td style="padding:6px 0">${{ github.repository }}</td>
                    </tr>

                    <tr>
                      <td style="padding:6px 16px 6px 0"><strong>Environment</strong></td>
                      <td style="padding:6px 0">Production</td>
                    </tr>

                    <tr>
                      <td style="padding:6px 16px 6px 0"><strong>Branch</strong></td>
                      <td style="padding:6px 0">${{ github.ref_name }}</td>
                    </tr>

                    <tr>
                      <td style="padding:6px 16px 6px 0"><strong>Commit</strong></td>
                      <td style="padding:6px 0">${{ github.sha }}</td>
                    </tr>

                    <tr>
                      <td style="padding:6px 16px 6px 0"><strong>Commit Message</strong></td>
                      <td style="padding:6px 0">${{ github.event.head_commit.message }}</td>
                    </tr>

                    <tr>
                      <td style="padding:6px 16px 6px 0"><strong>Triggered By</strong></td>
                      <td style="padding:6px 0">${{ github.actor }}</td>
                    </tr>
                  </table>

                  <p>Check attached deployment logs.</p>
                  <p>Check GitHub Actions logs immediately!</p>

                  <div style="margin-top:20px">
                    <a
                      href="https://github.com/rajesh-ranjan-git/rajesh-ranjan-portfolio/actions"
                      style="background:#dc2626;color:white;padding:12px 18px;text-decoration:none;border-radius:8px"
                    >
                      Check GitHub Actions logs
                    </a>
                  </div>
                </div>
              </div>
            </div>

          attachments: deploy-logs.txt
