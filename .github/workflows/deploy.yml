name: Deploy to Production

# Builds the standalone package here on GitHub's runner, then copies only that
# package (~42 MB) to the server. The server never holds source code, git
# history or the full node_modules. See "Deployment" in README.md.

on:
  push:
    branches:
      - main
  # Manual run from the Actions tab, e.g. the first deploy to a new server.
  workflow_dispatch:

# Never run two deploys against the server at the same time.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    # The package includes native binaries (sharp) built for this runner, so
    # the server must be x64 Linux. For an ARM (Graviton) server, use
    # ubuntu-24.04-arm here instead.
    runs-on: ubuntu-latest

    environment:
      name: production
      url: https://rajeshranjan.dev

    env:
      LOG_FILE: ${{ github.workspace }}/deploy-logs.txt

    steps:
      - name: Checkout latest Portfolio code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Detect Portfolio changed services
        id: changes
        run: |
          set -euo pipefail

          : > "$LOG_FILE"
          exec > >(tee -a "$LOG_FILE") 2>&1

          echo "===== STARTING PORTFOLIO DEPLOYMENT ====="

          echo "START_TIME=$(date +%s)" >> "$GITHUB_ENV"

          echo ""
          echo "NODE VERSION:"
          node -v

          echo ""
          echo "NPM VERSION:"
          npm -v

          echo ""
          echo "Checking changed files for Portfolio..."
          BEFORE="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            CHANGED_FILES=$(git ls-files)
          else
            CHANGED_FILES=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")
          fi
          echo "$CHANGED_FILES"

          BUILD_NEEDED=false

          if echo "$CHANGED_FILES" | grep -qvE '(^README\.md$|^RELEASE\.md$|^LICENSE$|^LICENSE\.md$|^\.gitignore$|^docs/)'; then
            BUILD_NEEDED=true
          fi

          if [ -n "$CHANGED_FILES" ] && [ "$BUILD_NEEDED" = "true" ]; then
            echo "portfolio=true" >> "$GITHUB_OUTPUT"
          else
            echo "portfolio=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.changes.outputs.portfolio == 'true'
        run: npm ci

      - name: Lint Portfolio code
        if: steps.changes.outputs.portfolio == 'true'
        run: npm run lint

      - name: Write production env file
        if: steps.changes.outputs.portfolio == 'true'
        env:
          PORTFOLIO_ENV_PRODUCTION: ${{ secrets.PORTFOLIO_ENV_PRODUCTION }}
        run: |
          set -euo pipefail

          if [ -z "$PORTFOLIO_ENV_PRODUCTION" ]; then
            echo "The PORTFOLIO_ENV_PRODUCTION secret is missing or empty." | tee -a "$LOG_FILE"
            exit 1
          fi

          mkdir -p env
          # Strip Windows line endings in case the secret was pasted from Windows.
          printf '%s\n' "$PORTFOLIO_ENV_PRODUCTION" | tr -d '\r' > env/.env.production
          chmod 600 env/.env.production

      - name: Build Portfolio standalone package
        if: steps.changes.outputs.portfolio == 'true'
        run: |
          set -euo pipefail

          exec > >(tee -a "$LOG_FILE") 2>&1

          echo ""
          echo "Building Portfolio..."
          # The postbuild script copies public/, .next/static and the pm2
          # config into .next/standalone.
          npm run build

      - name: Package Portfolio release
        if: steps.changes.outputs.portfolio == 'true'
        id: package
        run: |
          set -euo pipefail

          exec > >(tee -a "$LOG_FILE") 2>&1

          # The release carries its own env file. pm2 loads it with --env-file,
          # because the standalone server does not run next.config.ts.
          install -m 600 env/.env.production .next/standalone/.env.production

          RELEASE="$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}"
          tar -czf portfolio.tgz -C .next/standalone .

          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"

          echo ""
          echo "RELEASE: $RELEASE"
          echo "PACKAGE SIZE: $(du -h portfolio.tgz | cut -f1) compressed, $(du -sh .next/standalone | cut -f1) unpacked"

      - name: Deploy Portfolio release via SSH
        if: steps.changes.outputs.portfolio == 'true'
        id: deploy
        run: |
          set -euo pipefail

          exec > >(tee -a "$LOG_FILE") 2>&1

          mkdir -p ~/.ssh
          echo "${{ secrets.PORTFOLIO_EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          SSH_TARGET="${{ secrets.USERNAME }}@${{ secrets.HOST }}"
          SSH_OPTS=(-i ~/.ssh/deploy_key -o StrictHostKeyChecking=no)

          echo ""
          echo "Uploading release package..."
          ssh "${SSH_OPTS[@]}" "$SSH_TARGET" \
            'mkdir -p ~/portfolio/releases ~/portfolio/logs && cat > ~/portfolio/releases/upload.tgz' \
            < portfolio.tgz

          ssh "${SSH_OPTS[@]}" "$SSH_TARGET" bash -s <<'REMOTE_SCRIPT'
            set -euo pipefail

            APP_ROOT="$HOME/portfolio"
            RELEASE="${{ steps.package.outputs.release }}"
            RELEASE_DIR="$APP_ROOT/releases/$RELEASE"
            PORT=1995
            KEEP_RELEASES=2

            echo "Unpacking release $RELEASE..."
            mkdir -p "$RELEASE_DIR" "$APP_ROOT/logs"
            tar -xzf "$APP_ROOT/releases/upload.tgz" -C "$RELEASE_DIR"
            rm -f "$APP_ROOT/releases/upload.tgz"
            chmod 600 "$RELEASE_DIR/.env.production"

            PREVIOUS=""
            if [ -L "$APP_ROOT/current" ]; then
              PREVIOUS="$(readlink -f "$APP_ROOT/current")"
            fi

            # Points "current" at a release and (re)starts pm2 from it. A full
            # delete + start makes pm2 pick up any change in ecosystem.config.cjs.
            start_release() {
              ln -sfn "$1" "$APP_ROOT/current.tmp"
              mv -Tf "$APP_ROOT/current.tmp" "$APP_ROOT/current"
              pm2 delete portfolio >/dev/null 2>&1 || true
              pm2 start "$APP_ROOT/current/ecosystem.config.cjs" --only portfolio
            }

            # Waits up to 30 seconds for the home page to answer.
            is_healthy() {
              for _ in $(seq 1 30); do
                if curl -fsS -o /dev/null "http://127.0.0.1:$PORT/"; then
                  return 0
                fi
                sleep 1
              done
              return 1
            }

            echo "Starting release $RELEASE..."
            start_release "$RELEASE_DIR"

            if ! is_healthy; then
              echo "Release $RELEASE did not come online."
              pm2 logs portfolio --lines 100 --nostream || true

              if [ -n "$PREVIOUS" ] && [ -d "$PREVIOUS" ]; then
                echo "Rolling back to $(basename "$PREVIOUS")..."
                start_release "$PREVIOUS"
                if is_healthy; then
                  echo "Rollback is online."
                else
                  echo "Rollback also failed to come online!"
                fi
                pm2 save
              fi

              rm -rf "$RELEASE_DIR"
              exit 1
            fi

            pm2 save
            echo "Portfolio is online."

            echo "Removing old releases (keeping $KEEP_RELEASES)..."
            ls -1d "$APP_ROOT"/releases/*/ | sort | head -n -"$KEEP_RELEASES" | xargs -r rm -rf

            echo "===== PORTFOLIO SERVER STATS ====="
            echo ""
            echo "CPU LOAD:"
            uptime

            echo ""
            echo "MEMORY:"
            free -h

            echo ""
            echo "DISK:"
            df -h /

            echo ""
            echo "PORTFOLIO ON DISK:"
            du -sh "$APP_ROOT"/releases/* "$APP_ROOT/logs" || true

            echo ""
            echo "PM2 STATUS:"
            pm2 status
          REMOTE_SCRIPT

          echo ""
          echo "DEPLOYMENT DURATION:"
          END_TIME=$(date +%s)
          echo "$((END_TIME - START_TIME)) seconds"

          echo "Latest Portfolio code deployed successfully!"
          echo "===== PORTFOLIO DEPLOYMENT FINISHED ====="

      - name: Send Portfolio Deployment Success Email
        if: success()

        uses: dawidd6/action-send-mail@v3

        with:
          server_address: ${{ secrets.AWS_SMTP_ENDPOINT }}
          server_port: ${{ secrets.AWS_SMTP_PORT }}

          username: ${{ secrets.AWS_SMTP_USERNAME }}
          password: ${{ secrets.AWS_SMTP_PASSWORD }}

          subject: "✅ Portfolio Deployment Successful!"

          to: ${{ secrets.AWS_EMAIL_TO }}
          from: "Rajesh Ranjan | Portfolio <${{ secrets.AWS_EMAIL_FROM }}>"

          convert_markdown: false

          html_body: |
            <div style="font-family:Arial;background:#f5f5f5;padding:30px">
              <div style="max-width:600px;margin:auto;background:white;border-radius:12px;overflow:hidden">
                <div style="height:4px;background:linear-gradient(90deg,#3f82d9,#8b5cf6,#f54568)"></div>

                <div style="padding:24px">
                  <h1 style="margin-top:0">🚀 Portfolio Deployment Completed</h1>

                  <table style="width:100%;border-collapse:collapse">
                    <tr>
                      <td style="padding:6px 16px 6px 0"><strong>Repository</strong></td>
                      <td style="padding:6px 0">${{ github.repository }}</td>
                    </tr>

                    <tr>
                      <td style="padding:6px 16px 6px 0"><strong>Environment</strong></td>
                      <td style="padding:6px 0">Production</td>
                    </tr>

                    <tr>
                      <td style="padding:6px 16px 6px 0"><strong>Branch</strong></td>
                      <td style="padding:6px 0">${{ github.ref_name }}</td>
                    </tr>

                    <tr>
                      <td style="padding:6px 16px 6px 0"><strong>Commit</strong></td>
                      <td style="padding:6px 0">${{ github.sha }}</td>
                    </tr>

                    <tr>
                      <td style="padding:6px 16px 6px 0"><strong>Commit Message</strong></td>
                      <td style="padding:6px 0">${{ github.event.head_commit.message }}</td>
                    </tr>

                    <tr>
                      <td style="padding:6px 16px 6px 0"><strong>Triggered By</strong></td>
                      <td style="padding:6px 0">${{ github.actor }}</td>
                    </tr>

                    <tr>
                      <td style="padding:6px 16px 6px 0"><strong>Build Executed</strong></td>
                      <td style="padding:6px 0">${{ steps.changes.outputs.portfolio }}</td>
                    </tr>

                    <tr>
                      <td style="padding:6px 16px 6px 0"><strong>Release</strong></td>
                      <td style="padding:6px 0">${{ steps.package.outputs.release || 'not deployed' }}</td>
                    </tr>
                  </table>

                  <div style="margin-top:20px">
                    <a
                      href="https://rajeshranjan.dev"
                      style="background:#059669;color:white;padding:12px 18px;text-decoration:none;border-radius:8px"
                    >
                      Go to Portfolio
                    </a>
                  </div>
                </div>
              </div>
            </div>

          attachments: deploy-logs.txt

      - name: Send Portfolio Deployment Failure Email
        if: failure()

        uses: dawidd6/action-send-mail@v3

        with:
          server_address: ${{ secrets.AWS_SMTP_ENDPOINT }}
          server_port: ${{ secrets.AWS_SMTP_PORT }}

          username: ${{ secrets.AWS_SMTP_USERNAME }}
          password: ${{ secrets.AWS_SMTP_PASSWORD }}

          subject: "❌ Portfolio Deployment Failed!"

          to: ${{ secrets.AWS_EMAIL_TO }}
          from: "Rajesh Ranjan | Portfolio <${{ secrets.AWS_EMAIL_FROM }}>"

          convert_markdown: false

          html_body: |
            <div style="font-family:Arial;background:#f5f5f5;padding:30px">
              <div style="max-width:600px;margin:auto;background:white;border-radius:12px;overflow:hidden">
                <div style="height:4px;background:linear-gradient(90deg,#3f82d9,#8b5cf6,#f54568)"></div>

                <div style="padding:24px">
                  <h1 style="margin-top:0">⛔ Portfolio Deployment Failed</h1>

                  <table style="width:100%;border-collapse:collapse">
                    <tr>
                      <td style="padding:6px 16px 6px 0"><strong>Repository</strong></td>
                      <td style="padding:6px 0">${{ github.repository }}</td>
                    </tr>

                    <tr>
                      <td style="padding:6px 16px 6px 0"><strong>Environment</strong></td>
                      <td style="padding:6px 0">Production</td>
                    </tr>

                    <tr>
                      <td style="padding:6px 16px 6px 0"><strong>Branch</strong></td>
                      <td style="padding:6px 0">${{ github.ref_name }}</td>
                    </tr>

                    <tr>
                      <td style="padding:6px 16px 6px 0"><strong>Commit</strong></td>
                      <td style="padding:6px 0">${{ github.sha }}</td>
                    </tr>

                    <tr>
                      <td style="padding:6px 16px 6px 0"><strong>Commit Message</strong></td>
                      <td style="padding:6px 0">${{ github.event.head_commit.message }}</td>
                    </tr>

                    <tr>
                      <td style="padding:6px 16px 6px 0"><strong>Triggered By</strong></td>
                      <td style="padding:6px 0">${{ github.actor }}</td>
                    </tr>
                  </table>

                  <p>Check attached deployment logs.</p>
                  <p>Check GitHub Actions logs immediately!</p>

                  <div style="margin-top:20px">
                    <a
                      href="https://github.com/rajesh-ranjan-git/rajesh-ranjan-portfolio/actions"
                      style="background:#dc2626;color:white;padding:12px 18px;text-decoration:none;border-radius:8px"
                    >
                      Check GitHub Actions logs
                    </a>
                  </div>
                </div>
              </div>
            </div>

          attachments: deploy-logs.txt
